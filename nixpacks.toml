[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "npm install -g pnpm@10.27.0",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "cd apps/web && npx prisma generate --schema prisma/schema.prisma",
  "echo '=== Running Prisma migrations (schema: apps/web/prisma/schema.prisma) ===' && cd apps/web && npx prisma migrate deploy --schema prisma/schema.prisma || (echo '❌ MIGRATION FAILED!' && exit 1)",
  "echo '=== Migration deploy complete ===' ",
  "pnpm run build:web"
]

[start]
cmd = "pnpm run start:web"
